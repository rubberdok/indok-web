query DoorLog($offset: Int, $limit: Int, $result: String, $search: String, $since: DateTime, $until: DateTime) {
  doorLog(offset: $offset, limit: $limit, result: $result, search: $search, since: $since, until: $until) {
    total
    events {
      id
      eventType
      occurredAt
      doorIdentifier
      name
      isWebsiteUser
      holderKind
      mifareCsnReported
      cardFormat
      arxEvent
    }
  }
}

query nfcDoorAccess($pastDays: Int) {
  nfcDoorAccess(pastDays: $pastDays) {
    pastDays
    maxPastDays
    areasConnected
    people {
      key
      holderName
      cardNumber
      state
      blockedReason
      user {
        ...UserNfcDetail
      }
      periods {
        kind
        startsAt
        endsAt
        detail
      }
    }
  }
}

query nfcManualAccesses {
  nfcManualAccesses {
    id
    targetName
    isOrganization
    organizationPeople
    peopleCount
    startsAt
    endsAt
    reason
    createdByName
  }
}
