query DoorLog($offset: Int, $limit: Int, $result: String, $search: String, $since: DateTime, $until: DateTime) {
  doorLog(offset: $offset, limit: $limit, result: $result, search: $search, since: $since, until: $until) {
    total
    events {
      id
      eventType
      occurredAt
      doorIdentifier
      name
      isWebsiteUser
      holderKind
      mifareCsnReported
      cardFormat
      arxEvent
    }
  }
}
