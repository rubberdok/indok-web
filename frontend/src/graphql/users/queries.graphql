query user {
  user {
    ...User
  }
}

query userWithEventsAndOrgs {
  user {
    ...UserWithEventsAndOrgs
  }
}

query userToEdit {
  user {
    ...UserToEdit
  }
}

query userOrganizations {
  user {
    id
    isIndok
    organizations {
      ...UserOrganization
    }
  }
}

query adminEditCapabilities {
  canManageUserProfiles
  canManageUserNfc
}

query nfcUserSearch($query: String!, $limit: Int) {
  nfcUserSearch(query: $query, limit: $limit) {
    ...UserNfcSearch
  }
}

query nfcUser($id: ID!) {
  nfcUser(id: $id) {
    ...UserNfcDetail
    nfcPermanentAccessHistory {
      given
      changedAt
      changedBy
      reason
    }
  }
}

query nfcPermanentAccessUsers {
  nfcPermanentAccessUsers {
    ...UserNfcDetail
  }
}

query adminUser($id: ID!) {
  adminUser(id: $id) {
    ...UserAdminSearch
  }
}

query userSearch($query: String!, $limit: Int) {
  userSearch(query: $query, limit: $limit) {
    ...UserAdminSearch
  }
}
