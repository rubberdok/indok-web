mutation upsertMembership($membershipData: MembershipInput!) {
  upsertMembership(membershipData: $membershipData) {
    ok
    membership {
      ...MembershipWithOrganization
    }
  }
}

mutation addMembershipByIdentifier($organizationId: ID!, $identifier: String!) {
  addMembershipByIdentifier(organizationId: $organizationId, identifier: $identifier) {
    ok
  }
}

mutation removeMembership($membershipId: ID!) {
  removeMembership(membershipId: $membershipId) {
    ok
    removedMember {
      id
      username
      firstName
      lastName
    }
  }
}
