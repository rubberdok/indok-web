  status
  ownerUser {
    id
    firstName
    lastName
  }
  ownerOrganization {
    id
    name
  }
  bookingLevel {
    id
    name
    priority
  }
  isExternalBooking
  bookerName
  bookerEmail
  bookerPhone
  responsibleName
  responsibleEmail
  responsiblePhone
  eventType
  cleaningRequested
  depositStatus
  depositAmount
  outstandingDepositAmount
  comment
  adminComment
  guestList
  guestListEntries {
    ...JanHusGuestListEntry
  }
  doorAccessPolicy
  totalPrice
  durationMinutes
  priceOverrideTier
  priceOverrideAmount
  manuallyMarkedAsPaid
  vippsProduct {
    id
    name
    price
  }
  vippsOrder {
    id
    paymentStatus
  }
  createdAt
  updatedAt
}

fragment JanHusBookingRequest on JanHusBookingRequestType {
  id
  startsAt
  endsAt
  area {
    id
    name
  }
  requesterUser {
    id
    firstName
    lastName
  }
  ownerOrganization {
    id
    name
  }
  requesterName
  requesterEmail
  requesterPhone
  responsibleName
  responsibleEmail
  responsiblePhone
  eventType
  cleaningRequested
  comment
