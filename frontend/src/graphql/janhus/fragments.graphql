  generalBookingOpensWeeksBefore
  fallStartDate
  fallEndDate
  springStartDate
  springEndDate
  fallSemesterActive
  springSemesterActive
  externalBookingsEnabled
  privateBookingsEnabled
  cleaningOptionEnabled
}

fragment JanHusArea on JanHusAreaType {
  id
  name
  isActive
