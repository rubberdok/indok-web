      }
    }
  }
}

mutation UpdateJanhusBookingSettings($settingsData: JanHusBookingSettingsInput!) {
  updateJanhusBookingSettings(settingsData: $settingsData) {
    ok
    bookingSettings {
      ...JanHusBookingSettings
    }
  }
}

mutation CreateJanhusArea($areaData: JanHusAreaInput!) {
  createJanhusArea(areaData: $areaData) {
    ok
    area {
      ...JanHusArea
    }
  }
}

mutation UpdateJanhusArea($areaData: UpdateJanHusAreaInput!) {
  updateJanhusArea(areaData: $areaData) {
    ok
    area {
      ...JanHusArea
    }
  }
}

mutation DeleteJanhusArea($id: ID!) {
  deleteJanhusArea(id: $id) {
    ok
  }
}

mutation CreateJanhusPaymentProduct($bookingId: ID!) {
  createJanhusPaymentProduct(bookingId: $bookingId) {
    ok
    productId
    booking {
      ...JanHusBooking
    }
  }
}

mutation DeleteJanhusBooking($bookingId: ID!) {
  deleteJanhusBooking(bookingId: $bookingId) {
    ok
  }
}

mutation DeleteJanhusBookingRequest($requestId: ID!) {
  deleteJanhusBookingRequest(requestId: $requestId) {
    ok
  }
}
